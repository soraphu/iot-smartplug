        <script>
            const SUPABASE_URL = 'https://npjszdvrfqrllpqirmvd.supabase.co'

            let showChart = null;

            const dataList = {

                energyChart: {

                }

            let setChart = {

            function powerChart() {
                const ctx = document.getElementById('powerChart').getContext('2d');

                if (showChart !== null) {
                    showChart.destroy();
                }

                showChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: timeLabels,
                        datasets: [
                            {
                                label: setChart.label,
                                data: setChart.data,
                                borderColor: setChart.borderColor,
                                backgroundColor: setChart.backgroundColor,
                                tension: setChart.tension,
                                fill: setChart.fill
                            },
                        ]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'top'
                            }

                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            },
                            x: { // หรือชื่อแกนที่คุณตั้งไว้
                                ticks: {
                                    // นี่คือพระเอกของเรา
                                    autoSkip: true,

                                    // (Option เสริม) บังคับว่าต้องมี Label อย่างน้อยกี่จุด
                                    maxTicksLimit: 30,

                                    // (Option เสริม) ป้องกันไม่ให้ Label เบียดกันจนเกินไป
                                    autoSkipPadding: 20
                                }
                            }
