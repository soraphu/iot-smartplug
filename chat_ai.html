<!DOCTYPE HTML>
<html>

<head>
    <meta charset="UTF-8">
    <title>Smart Plug Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .status-on {
            color: #28a745;
            font-weight: bold;
        }

        .status-off {
            color: #dc3545;
            font-weight: bold;
        }

        .pzem-val {
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand navbar-light bg-white">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Chat Ai</span>
            <div class="dropdown">
                <button class="btn btn-primary dropdown-toggle" type="button" id="navDropdown" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Menu
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navDropdown">
                    <li><a class="dropdown-item" href="./index">Dashboard</a></li>
                    <li><a class="dropdown-item" href="./chart">Chart</a></li>
                    <li><a class="dropdown-item">AI</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Ask questions</h5>
                    </div>
                    <div class="card-body" style="height: 400px; overflow-y: auto;" id="chatBox">
                        <!-- Messages will appear here -->
                    </div>
                    <div class="card-footer">
                        <div class="input-group">
                            <input type="text" class="form-control" id="messageInput"
                                placeholder="Type your message...">
                            <button class="btn btn-primary" type="button" id="sendBtn">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            function sendMessage() {
                const input = document.getElementById('messageInput');
                const message = input.value.trim();
                if (!message) return;

                const chatBox = document.getElementById('chatBox');
                chatBox.innerHTML += `<div class="mb-2"><strong>You:</strong> ${message}</div>`;
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;

                // Simulate AI response
                setTimeout(() => {
                    chatBox.innerHTML += `<div class="mb-2"><strong>AI:</strong> This is a demo response.</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 500);
            }
        </script>
    </div>
</body>

</html>
