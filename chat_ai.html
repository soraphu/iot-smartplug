<!DOCTYPE HTML>
<html>

<head>
    <meta charset="UTF-8">
    <title>Smart Plug Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .status-on {
            color: #28a745;
            font-weight: bold;
        }

        .status-off {
            color: #dc3545;
            font-weight: bold;
        }

        .pzem-val {
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand navbar-light bg-white">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Chat Ai</span>
            <div class="dropdown">
                <button class="btn btn-primary dropdown-toggle" type="button" id="navDropdown" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Menu
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navDropdown">
                    <li><a class="dropdown-item" href="./index">Dashboard</a></li>
                    <li><a class="dropdown-item" href="./chart">Chart</a></li>
                    <li><a class="dropdown-item">AI</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Ask questions 💬</h5>
                    </div>
                    <div class="card-body" style="height: 400px; overflow-y: auto;" id="chatBox">
                        <!-- Messages will appear here -->
                    </div>
                    <div class="card-footer">
                        <div class="input-group">
                            <input type="text" class="form-control" id="messageInput"
                                placeholder="Type your message...">
                            <button class="btn btn-primary" type="button" id="sendBtn">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script type="module">
            import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";
            const API_KEY = "AIzaSyD5hV1DSmBYWXSiyBFXkHXdjPo2P-tPPrk";
            const genAI = new GoogleGenerativeAI(API_KEY);

            const SUPABASE_URL = 'https://npjszdvrfqrllpqirmvd.supabase.co'
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wanN6ZHZyZnFybGxwcWlybXZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MjAyNTEsImV4cCI6MjA4NzQ5NjI1MX0.TgEerk3G3xoXprmaJgLsnQrkwpUqU77RWdhTrSw749g'
            const supabaseDB = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            let energy_log_data = [];

            async function fetchEnergyLog() {
                const { data, error } = await supabaseDB
                    .from('energy_log')
                    .select(`time:create_at::time, power, voltage, current, energy`) // แก้ตรงนี้
                    .limit(120);
                energy_log_data = data;

                if (error) {
                    console.error(error)
                    return
                }
            }//fetchAll

            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            function sendMessage() {
                const input = document.getElementById('messageInput');
                const message = input.value.trim();
                if (!message) return;

                const chatBox = document.getElementById('chatBox');
                chatBox.innerHTML += `<div class="mb-2 text-secondary"><strong>You:</strong> ${message}</div>`;
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;
                askGeminiAndGetAnswer(message);
            }

            async function askGeminiAndGetAnswer(message) {
                const chatBox = document.getElementById('chatBox');
                chatBox.innerHTML += `<div class="mb-2 text-success"><strong>Ai:</strong> กำลังคิด...</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;

                try {
                    const model = genAI.getGenerativeModel({
                        model: "gemma-3-4b-it", // เลือกโมเดลที่เหมาะสม
                        generationConfig: {
                            maxOutputTokens: 100, // จำกัดคำตอบให้สั้น จะได้ไม่โดนตัดคิว
                            temperature: 0.1,     // ค่าต่ำๆ ช่วยให้คำนวณแม่นยำขึ้น
                        }
                    });
                    await fetchEnergyLog();

                    const prompt = `Here is the energy log data: ${JSON.stringify(energy_log_data)}. The user asks: ${message} + Please answer as thai language and very short maxOutputTokens: 100.`;
                    // console.log(prompt);
                    const result = await model.generateContent(prompt);
                    const response = await result.response;
                    const aiAnswer = response.text();

                    chatBox.lastChild.innerHTML = `<strong>Ai:</strong> ${aiAnswer}`;
                } catch (error) {
                    console.error(error);
                    if (error.status === 429) {
                        chatBox.lastChild.innerHTML = `<strong>Ai:</strong.text-primary> เกิดข้อผิดพลาด: เกินโควต้าแล้วครับ กรุณาลองใหม่ในภายหลัง หรือวันถัดไป`;
                    } else {
                        chatBox.lastChild.innerHTML = `<strong>Ai:</strong> เกิดข้อผิดพลาด: ${error.message}`;
                    }
                }
            }
        </script>
    </div>
</body>

</html>
