<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>ตั้งเวลาเปิด/ปิดระบบ</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            color: #333;
        }

        .timer-container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            background-color: #f9f9f9;
        }

        .status-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .time-inputs {
            display: flex;
            gap: 15px;
            transition: opacity 0.3s;
        }

        .time-group {
            display: flex;
            flex-direction: column;
        }

        .disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="time"] {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        /* สไตล์ปุ่ม Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #4CAF50;
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }
    </style>
</head>

<body>
    <div class="timer-container">
        <div class="status-section">
            <span><strong>สถานะระบบตั้งเวลา:</strong></span>
            <label class="switch">
                <input type="checkbox" id="toggleSystem" onchange="toggleTimer()">
                <span class="slider"></span>
            </label>
        </div>

        <div id="timeSettings" class="time-inputs disabled">
            <div class="time-group">
                <label for="open-time">เวลาเปิด:</label>
                <input type="time" id="open-time" name="open-time" value="08:00">
            </div>
            <div class="time-group">
                <label for="close-time">เวลาปิด:</label>
                <input type="time" id="close-time" name="close-time" value="17:00">
            </div>
        </div>
    </div>

    <script>
        function toggleTimer() {
            const isChecked = document.getElementById('toggleSystem').checked;
            const timeSettings = document.getElementById('timeSettings');

            if (isChecked) {
                timeSettings.classList.remove('disabled');
            } else {
                timeSettings.classList.add('disabled');
            }
        }
    </script>

</body>

</html>
