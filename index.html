<!DOCTYPE HTML>
<html>

<head>
    <meta charset="UTF-8">
    <title>Smart Plug Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .status-on {
            color: #28a745;
            font-weight: bold;
        }

        .status-off {
            color: #dc3545;
            font-weight: bold;
        }

        .pzem-val {
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
        }

        .timer-container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            background-color: #f9f9f9;
        }

        .status-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .time-inputs {
            display: flex;
            gap: 15px;
            transition: opacity 0.3s;
        }

        .time-group {
            display: flex;
            flex-direction: column;
        }

        .disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="time"] {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        /* สไตล์ปุ่ม Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #4CAF50;
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand navbar-light bg-white">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Dashboard</span>
            <div class="dropdown">
                <button class="btn btn-primary dropdown-toggle" type="button" id="navDropdown" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Menu
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navDropdown">
                    <li><a class="dropdown-item">Dashboard</a></li>
                    <li><a class="dropdown-item" href="/chart.html">Chart</a></li>
                    <li><a class="dropdown-item" href="/chat_ai.html">AI</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="row justify-content-center">
            <div class="col-md-8 text-center mb-4">
                <h1 class="display-5 fw-bold text-primary">☕ Smart Coffee Plug</h1>
                <p class="text-muted">ระบบควบคุมปลั๊กไฟอัจฉริยะ</p>
            </div>

            <div class="col-md-10 mb-4">
                <div class="row g-3">
                    <div class="col-6 col-md-3">
                        <div class="card p-3 text-center">
                            <h6>Voltage</h6>
                            <div id="v" class="pzem-val">0</div><small>V</small>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card p-3 text-center">
                            <h6>Current</h6>
                            <div id="c" class="pzem-val">0</div><small>A</small>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card p-3 text-center">
                            <h6>Power</h6>
                            <div id="p" class="pzem-val">0</div><small>W</small>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card p-3 text-center">
                            <h6>Energy</h6>
                            <div id="e" class="pzem-val">0</div><small>kWh</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card p-4">
                    <h5 class="mb-3">Control Panel</h5>
                    <div class="mb-3">
                        สถานะรีเลย์: <span id="r_status">กำลังโหลด...</span>
                    </div>
                    <div class="d-grid gap-2 d-md-block mb-4 text-center" id="controlButtons">
                        <button onclick="toggleState(ACTIVE_LOW ? false : true)"
                            class="btn btn-success px-4">ON</button>
                        <button onclick="toggleState(ACTIVE_LOW ? true : false)"
                            class="btn btn-danger px-4">OFF</button>
                    </div>
                </div>
            </div>

            <div class="timer-container justify-content-center">
                <div class="status-section">
                    <span><strong>สถานะระบบตั้งเวลา:</strong></span>
                    <label class="switch">
                        <input type="checkbox" id="timeToggleSystem" onchange="toggleTimer()">
                        <span class="slider"></span>
                    </label>
                </div>

                <div id="timeSettings" class="time-inputs disabled row g-3 align-items-end">
                    <div class="col-12 col-sm-4">
                        <div class="time-group">
                            <label for="open-time" class="form-label">เวลาเปิด:</label>
                            <input type="time" id="open-time" class="form-control" value="00:00">
                        </div>
                    </div>

                    <div class="col-12 col-sm-4">
                        <div class="time-group">
                            <label for="close-time" class="form-label">เวลาปิด:</label>
                            <input type="time" id="close-time" class="form-control" value="00:00">
                        </div>
                    </div>

                    <div class="col-12 col-sm-4">
                        <button onclick="saveTimerSettings()" class="btn btn-primary w-100">บันทึกเวลา</button>
                    </div>
                </div>
            </div>

        </div>


        <script>
            const SUPABASE_URL = 'https://npjszdvrfqrllpqirmvd.supabase.co'
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wanN6ZHZyZnFybGxwcWlybXZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MjAyNTEsImV4cCI6MjA4NzQ5NjI1MX0.TgEerk3G3xoXprmaJgLsnQrkwpUqU77RWdhTrSw749g'
            const supabaseDB = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const ACTIVE_LOW = true;

            subscribeToChanges();
            initData();

            async function initData() {
                const { data, error } = await supabaseDB
                    .from('control')
                    .select('*')
                    .eq('id', '1');


                const newData = data[0];
                newData.turn_on = ACTIVE_LOW ? !newData.turn_on : newData.turn_on;
                relay_status = document.getElementById('r_status');
                relay_status.style.color = newData.turn_on ? "green" : "red";
                relay_status.innerText = newData.turn_on ? "ON" : "OFF";
                document.getElementById('open-time').value = reverseTimeString(newData.turn_on_time);
                document.getElementById('close-time').value = reverseTimeString(newData.turn_off_time);
                document.getElementById('timeToggleSystem').checked = newData.timer_enable;
                if (newData.timer_enable) {
                    document.getElementById('timeSettings').classList.remove('disabled');
                    document.getElementById('controlButtons').classList.add('disabled');
                } else {
                    document.getElementById('timeSettings').classList.add('disabled');
                    document.getElementById('controlButtons').classList.remove('disabled');
                }
                if (error) {
                    console.error(error)
                    return
                }

            }//fetchAll

            function subscribeToChanges() {
                supabaseDB
                    .channel('realtime-data')
                    .on(
                        'postgres_changes',
                        {
                            event: 'UPDATE',    // ดักฟังการแก้ไขข้อมูล (PATCH จาก ESP32)
                            schema: 'public',
                            table: 'control'    // ชื่อตารางที่คุณเปิด Enable Realtime ไว้
                        },
                        (payload) => {
                            const currentData = payload.new; // ข้อมูลใหม่ที่เพิ่งอัปเดต
                            console.log(payload.new);
                            document.getElementById('v').innerText = currentData.voltage;
                            document.getElementById('c').innerText = currentData.current;
                            document.getElementById('p').innerText = currentData.power;
                            document.getElementById('e').innerText = currentData.energy;
                            currentData.turn_on = ACTIVE_LOW ? !currentData.turn_on : currentData.turn_on;
                            relay_status = document.getElementById('r_status');
                            relay_status.style.color = currentData.turn_on ? "green" : "red";
                            relay_status.innerText = currentData.turn_on ? "ON" : "OFF";
                        }
                    )
                    .subscribe((status) => {
                        if (status === 'SUBSCRIBED') {
                            console.log("Subscribed control database");
                        }
                    });
            }

            async function toggleState(state) {
                const { data, error } = await supabaseDB
                    .from('control')
                    .update({ turn_on: state })
                    .eq('id', '1')
                    .select();
                if (error) {
                    console.error(error)
                    return
                }
            }//fetchAll

            function reverseTimeString(totalMinutes) {
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            }

            function toggleTimer() {
                const isChecked = document.getElementById('timeToggleSystem').checked;
                const timeSettings = document.getElementById('timeSettings');

                if (isChecked) {
                    timeSettings.classList.remove('disabled');
                    document.getElementById('controlButtons').classList.add('disabled');

                    supabaseDB
                        .from('control')
                        .update({ timer_enable: true })
                        .eq('id', '1')
                        .then(({ data, error }) => {
                            if (error) {
                                console.error("Error saving timer settings:", error);
                            } else {
                                console.log("Timer enabled.", data);
                            }
                        });
                } else {
                    timeSettings.classList.add('disabled');
                    document.getElementById('controlButtons').classList.remove('disabled');

                    supabaseDB
                        .from('control')
                        .update({ timer_enable: false })
                        .eq('id', '1')
                        .then(({ data, error }) => {
                            if (error) {
                                console.error("Error saving timer settings:", error);
                            } else {
                                console.log("Timer disabled.", data);
                            }
                        });
                }
            }

            function saveTimerSettings() {
                const onTime = document.getElementById('open-time').value;
                const offTime = document.getElementById('close-time').value;

                if (onTime === offTime) {
                    alert("กรุณาเลือกเวลาเปิดและเวลาปิดให้แตกต่างกัน");
                    return;
                }//if: on/off is the same.

                const [hoursOn, minutesOn] = onTime.split(':').map(Number);
                const totalMinutesOn = (hoursOn * 60) + minutesOn;

                const [hoursOff, minutesOff] = offTime.split(':').map(Number);
                const totalMinutesOff = (hoursOff * 60) + minutesOff; // จะได้ 1170

                // console.log(totalMinutesOn);
                // console.log(totalMinutesOff);
                supabaseDB
                    .from('control')
                    .update({ turn_on_time: totalMinutesOn, turn_off_time: totalMinutesOff })
                    .eq('id', '1')
                    .then(({ data, error }) => {
                        if (error) {
                            console.error("Error saving timer settings:", error);
                        } else {
                            console.log("Timer settings saved:", data);
                            alert(`บันทึกเวลาเรียบร้อย!\nเวลาเปิด: ${onTime} น.\nเวลาปิด: ${offTime} น.`);
                        }
                    });
            }//saveTimerSettings

        </script>
    </div>

</body>

</html>
