<!DOCTYPE HTML>
<html>

<head>
    <meta charset="UTF-8">
    <title>Smart Plug Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .status-on {
            color: #28a745;
            font-weight: bold;
        }

        .status-off {
            color: #dc3545;
            font-weight: bold;
        }

        .pzem-val {
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand navbar-light bg-white">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Dashboard</span>
            <div class="dropdown">
                <button class="btn btn-primary dropdown-toggle" type="button" id="navDropdown" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Menu
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navDropdown">
                    <li><a class="dropdown-item">Dashboard</a></li>
                    <li><a class="dropdown-item" href="/chart.html">Chart</a></li>
                    <li><a class="dropdown-item" href="/chat_ai.html">AI</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="row justify-content-center">
            <div class="col-md-8 text-center mb-4">
                <h1 class="display-5 fw-bold text-primary">☕ Smart Coffee Plug</h1>
                <p class="text-muted">ระบบควบคุมปลั๊กไฟอัจฉริยะ</p>
            </div>

            <div class="col-md-10 mb-4">
                <div class="row g-3">
                    <div class="col-6 col-md-3">
                        <div class="card p-3 text-center">
                            <h6>Voltage</h6>
                            <div id="v" class="pzem-val">0</div><small>V</small>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card p-3 text-center">
                            <h6>Current</h6>
                            <div id="c" class="pzem-val">0</div><small>A</small>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card p-3 text-center">
                            <h6>Power</h6>
                            <div id="p" class="pzem-val">0</div><small>W</small>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card p-3 text-center">
                            <h6>Energy</h6>
                            <div id="e" class="pzem-val">0</div><small>kWh</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="mb-3">Control Panel</h5>
                    <div class="mb-3">
                        สถานะรีเลย์: <span id="r_status">กำลังโหลด...</span>
                    </div>
                    <div class="d-grid gap-2 d-md-block mb-4 text-center">
                        <button onclick="toggleState(true)" class="btn btn-success px-4">ON</button>
                        <button onclick="toggleState(false)" class="btn btn-danger px-4">OFF</button>
                    </div>
                </div>
            </div>
        </div>

        <script>

            const SUPABASE_URL = 'https://npjszdvrfqrllpqirmvd.supabase.co'
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wanN6ZHZyZnFybGxwcWlybXZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MjAyNTEsImV4cCI6MjA4NzQ5NjI1MX0.TgEerk3G3xoXprmaJgLsnQrkwpUqU77RWdhTrSw749g'
            const supabaseDB = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            subscribeToChanges();
            async function fetchEnergyLog() {
                const { data, error } = await supabaseDB
                    .from('energy_log')
                    .select('*')

                console.log(data);

                if (error) {
                    console.error(error)
                    return
                }
            }//fetchAll

            function subscribeToChanges() {
                supabaseDB
                    .channel('realtime-data')
                    .on(
                        'postgres_changes',
                        {
                            event: 'UPDATE',    // ดักฟังการแก้ไขข้อมูล (PATCH จาก ESP32)
                            schema: 'public',
                            table: 'control'    // ชื่อตารางที่คุณเปิด Enable Realtime ไว้
                        },
                        (payload) => {
                            const currentData = payload.new; // ข้อมูลใหม่ที่เพิ่งอัปเดต
                            // console.log(payload.new);
                            document.getElementById('v').innerText = currentData.voltage;
                            document.getElementById('c').innerText = currentData.current;
                            document.getElementById('p').innerText = currentData.power;
                            document.getElementById('e').innerText = currentData.energy;
                            document.getElementById('r_status').innerText = currentData.turn_on ? "ON" : "OFF";
                        }
                    )
                    .subscribe((status) => {
                        if (status === 'SUBSCRIBED') {
                            console.log("Subscribed control database");
                        }
                    });
            }

            async function toggleState(state) {
                const { data, error } = await supabaseDB
                    .from('control')
                    .update({ turn_on: state })
                    .eq('id', '1')
                    .select();
                document.getElementById('r_status').innerText = data[0].turn_on ? "ON" : "OFF";
                if (error) {
                    console.error(error)
                    return
                }
            }//fetchAll
        </script>
    </div>

</body>

</html>
