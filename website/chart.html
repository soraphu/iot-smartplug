<!DOCTYPE HTML>
<html>

<head>
    <meta charset="UTF-8">
    <title>Smart Plug</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="connection.js"></script>

    <style>
        body {
            background: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .status-on {
            color: #28a745;
            font-weight: bold;
        }

        .status-off {
            color: #dc3545;
            font-weight: bold;
        }

        .pzem-val {
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand navbar-light bg-white">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Chart</span>
            <div class="dropdown">
                <button class="btn btn-primary dropdown-toggle" type="button" id="navDropdown" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Menu
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navDropdown">
                    <li><a class="dropdown-item" href="index.html">Dashboard</a></li>
                    <li><a class="dropdown-item">Chart</a></li>
                    <li><a class="dropdown-item" href="chat_ai.html">AI</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="d-flex justify-content-center mb-3">
                    <button onclick="handleGenerateChart('powerChartElement')"
                        class="btn btn-outline-primary me-2">Power</button>
                    <button onclick="handleGenerateChart('currentChartElement')"
                        class="btn btn-outline-success me-2">Current</button>
                    <button onclick="handleGenerateChart('energyChartElement')"
                        class="btn btn-outline-danger">Energy</button>
                </div>
                <div class="card p-4">
                    <h5 class="card-title">Power Consumption Chart</h5>
                    <canvas id="powerChart"></canvas>
                </div>
            </div>
        </div>

        <script>
            let powerData = [];
            let currentData = [];
            let energyData = [];
            let timeLabels = [];

            let chart = null;
            let makeChartList = {}

            async function handleFetchEnergyLogData() {
                const { data, error } = await supabaseDB
                    .from('energy_log')
                    .select('*')
                currentData = data.map(entry => entry.current);
                powerData = data.map(entry => entry.power);
                energyData = data.map(entry => entry.energy);
                timeLabels = data.map(entry => new Date(entry.create_at).toLocaleTimeString('th-TH', {
                    hour: '2-digit',
                    minute: '2-digit',
                    day: '2-digit',
                    month: '2-digit',
                    year: '2-digit'
                }));
                // console.log(timeLabels);

                makeChartList = {
                    powerChartElement: {
                        label: 'Power (W)',
                        data: powerData,
                        borderColor: '#0d6efd',
                        backgroundColor: 'rgba(13, 110, 253, 0.4)',
                        tension: 0.4,
                    },
                    currentChartElement: {
                        label: 'Current (A)',
                        data: currentData,
                        borderColor: '#ffc107',
                        backgroundColor: 'rgba(255, 193, 7, 0.4)',
                        tension: 0.4,
                    },
                    energyChartElement: {
                        label: 'Energy (kWh)',
                        data: energyData,
                        borderColor: '#dc3545',
                        backgroundColor: 'rgba(220, 53, 69, 0.4)',
                        tension: 0.4,
                    }
                }
                console.log(makeChartList);

                handleGenerateChart('powerChartElement');

                if (error) {
                    console.error(error)
                    return
                }

            }//fetchAll

            function handleGenerateChart(dataType) {
                const ctx = document.getElementById('powerChart').getContext('2d');

                if (chart !== null) {
                    chart.destroy();
                }

                chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: timeLabels,
                        datasets: [
                            {
                                label: makeChartList[dataType].label,
                                data: makeChartList[dataType].data,
                                borderColor: makeChartList[dataType].borderColor,
                                backgroundColor: makeChartList[dataType].backgroundColor,
                                tension: makeChartList[dataType].tension,
                                fill: true
                            },
                        ]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'top'
                            }

                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            },
                            x: { // หรือชื่อแกนที่คุณตั้งไว้
                                ticks: {
                                    // นี่คือพระเอกของเรา
                                    autoSkip: true,

                                    // (Option เสริม) บังคับว่าต้องมี Label อย่างน้อยกี่จุด
                                    maxTicksLimit: 30,

                                    // (Option เสริม) ป้องกันไม่ให้ Label เบียดกันจนเกินไป
                                    autoSkipPadding: 20
                                }
                            }
                        }
                    }
                });
            }

            //Call function.
            handleFetchEnergyLogData();

        </script>
    </div>

</body>

</html>
